[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ML-OPS-PIPELINE"
version = "0.1.0"
description = "Enterprise-grade MLOps system for customer conversion prediction"
authors = [
    { name = "Your Name" }
]
dependencies = []
requires-python = ">=3.10"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--cov=src --cov-report=html --cov-report=term-missing"
testpaths = [
    "tests"
]